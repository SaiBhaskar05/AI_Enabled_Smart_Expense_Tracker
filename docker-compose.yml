services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: expense_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=smart_expense_tracker

  # Python ML Microservice
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: expense_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/model.pkl
      - VECTORIZER_PATH=models/vectorizer.pkl
      - METRICS_PATH=models/metrics.json

  # Node.js API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ml
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart_expense_tracker
      - ML_API_URL=http://ml:8000
      - JWT_SECRET=${JWT_SECRET:-smart_expense_tracker_secret_key_production}
      - JWT_EXPIRE=7d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:80}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
